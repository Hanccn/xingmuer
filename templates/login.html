{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#FFF8F3">
<title>登录 — 行木儿</title>
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
<div style="width:100%;max-width:400px;padding:var(--space-lg);">
  <div style="text-align:center;margin-bottom:var(--space-xl);">
    <a href="/" style="font-family:var(--font-display);font-size:1.5rem;font-weight:700;color:var(--ink);text-decoration:none;"><span class="logo-icon" style="display:inline-flex;width:32px;height:32px;background:var(--accent);color:#fff;border-radius:8px;align-items:center;justify-content:center;font-size:0.9375rem;margin-right:6px;">木</span>行木儿</a>
  </div>
  <div class="card">
    <h2 style="text-align:center;margin-bottom:var(--space-lg);">欢迎回来</h2>
    {% if form.errors %}
    <div class="card" style="background:var(--accent-soft);margin-bottom:var(--space-md);padding:var(--space-md);"><p style="color:var(--accent);font-size:0.875rem;">用户名或密码错误，请重试</p></div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <div style="margin-bottom:var(--space-md);">
        <label style="font-size:0.875rem;font-weight:500;display:block;margin-bottom:4px;">用户名</label>
        <input type="text" name="username" style="width:100%;height:44px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 var(--space-md);font-family:var(--font-body);font-size:0.9375rem;outline:none;" required autofocus>
      </div>
      <div style="margin-bottom:var(--space-lg);">
        <label style="font-size:0.875rem;font-weight:500;display:block;margin-bottom:4px;">密码</label>
        <input type="password" name="password" style="width:100%;height:44px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 var(--space-md);font-family:var(--font-body);font-size:0.9375rem;outline:none;" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">登录</button>
    </form>
    <p style="text-align:center;margin-top:var(--space-md);font-size:0.8125rem;color:var(--ink-muted);">测试账号：demo / demo123</p>
  </div>
  <p style="text-align:center;margin-top:var(--space-lg);font-size:0.8125rem;color:var(--ink-subtle);"><a href="/">← 返回首页</a></p>
</div>
</body>
</html>
